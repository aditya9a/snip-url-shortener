name: Keep Render service awake

on:
  schedule:
    # Render's free service can sleep after inactivity. This check runs from
    # GitHub (outside Render), so it can also wake a sleeping instance.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Configure this repository variable with the deployed URL, including
      # /api/health. Keeping it outside source control also supports domains.
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Verify uptime URL is configured
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "Set the RENDER_HEALTH_URL repository variable to https://your-service.onrender.com/api/health"
            exit 1
          fi
      - name: Ping production health endpoint
        run: |
          curl --fail --show-error --silent --location \
            --connect-timeout 20 --max-time 90 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            "$RENDER_HEALTH_URL"
