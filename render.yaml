services:
  - type: web
    name: snip-url-shortener
    runtime: node
    plan: free
    # Vite is a client devDependency, so install client devDependencies even
    # though NODE_ENV=production is set for the running service.
    buildCommand: npm install --prefix server && npm install --include=dev --prefix client && npm run build --prefix client
    startCommand: npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
